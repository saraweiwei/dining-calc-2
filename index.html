<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZ Dining Master</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #4dabf7;
            --text-main: #FFFFFF;
            --text-dim: #94a3b8;
            --input-bg: #2d2d2d;
            --font-zh: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            --font-en: "Arial", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-zh);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 1.8rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-family: var(--font-en); font-weight: 300; font-size: 1.2rem; color: var(--text-dim); margin: 0; letter-spacing: 2px; text-transform: uppercase; }

        .section-title { font-size: 0.95rem; color: var(--accent-blue); margin-bottom: 1.2rem; font-weight: bold; border-left: 3px solid var(--accent-blue); padding-left: 10px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 1.5rem; width: 100%; }
        .full-width { grid-column: span 2; }

        .input-group { display: flex; flex-direction: column; width: 100%; }
        label { font-size: 0.85rem; margin-bottom: 6px; font-weight: bold; }
        
        input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 15px;
            color: white;
            font-family: var(--font-en);
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
            -webkit-appearance: none;
        }
        input:focus { border-color: var(--accent-blue); }

        /* 符號按鈕樣式 */
        .op-container {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            margin-bottom: 12px;
        }
        .op-btn {
            flex: 1;
            background: #333;
            border: none;
            color: var(--accent-blue);
            padding: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            active { background: #444; }
        }

        .ratio-display {
            background: rgba(77, 171, 247, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            font-family: var(--font-en);
            font-size: 0.85rem;
            margin-bottom: 2rem;
            color: var(--accent-blue);
            font-weight: bold;
        }

        .divider { height: 1px; background: #333; margin: 2rem 0; position: relative; width: 100%; }
        .divider::after { content: "Personal Calculation"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--card-bg); padding: 0 15px; font-size: 0.7rem; color: #555; }

        .total-container { text-align: center; margin-top: 1rem; }
        .total-label { font-size: 1rem; font-weight: bold; color: var(--text-dim); margin-bottom: 0.5rem; display: block; }
        .total-amount { 
            font-family: var(--font-en);
            font-size: 4.5rem; 
            font-weight: 900; 
            color: var(--accent-blue); 
            line-height: 1.1;
            text-shadow: 0 10px 20px rgba(77, 171, 247, 0.2);
        }

        .details { display: flex; justify-content: space-between; margin-top: 1.8rem; font-family: var(--font-en); font-weight: bold; font-size: 0.9rem; border-top: 1px solid #333; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <header>
        <h1>Calculator</h1>
    </header>

    <div class="section-title">Bill Overview</div>
    <div class="grid">
        <div class="input-group full-width">
            <label>發票餐點原價 (Subtotal)</label>
            <input type="number" id="billSubtotal" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="input-group">
            <label>稅金金額 (Tax $)</label>
            <input type="number" id="billTax" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="input-group">
            <label>小費金額 (Tips $)</label>
            <input type="number" id="billTip" placeholder="0.00" inputmode="decimal">
        </div>
    </div>

    <div class="ratio-display">
        <div>Tax%: <span id="autoTaxRate">0.00</span>%</div>
        <div>Tips%: <span id="autoTipRate">0.00</span>%</div>
    </div>

    <div class="divider"></div>

    <div class="section-title">個人分攤 (Personal Share)</div>
    <div class="input-group">
        <label>個人餐點原價</label>
        <input type="text" id="personSubtotal" placeholder="0.00" inputmode="decimal">
        <div class="op-container">
            <button class="op-btn" onclick="addOp('+')">+</button>
            <button class="op-btn" onclick="addOp('-')">-</button>
            <button class="op-btn" onclick="addOp('*')">×</button>
            <button class="op-btn" onclick="addOp('/')">÷</button>
        </div>
    </div>

    <div class="total-container">
        <span class="total-label">您應付總額 (Personal Share)</span>
        <div class="total-amount" id="personTotal">$0.00</div>
    </div>

    <div class="details">
        <span style="color:var(--text-dim)">Detail:</span>
        <span id="personBreakdown">(Tax) $0.00 + (Tips) $0.00</span>
    </div>
</div>

<script>
    const inputs = ['billSubtotal', 'billTax', 'billTip', 'personSubtotal'];
    const elements = {};
    inputs.forEach(id => elements[id] = document.getElementById(id));
    
    const display = {
        taxRate: document.getElementById('autoTaxRate'),
        tipRate: document.getElementById('autoTipRate'),
        total: document.getElementById('personTotal'),
        breakdown: document.getElementById('personBreakdown')
    };

    function format(num) {
        return num.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    // 點擊符號按鈕時，將符號填入並觸發計算
    function addOp(op) {
        elements.personSubtotal.value += op;
        elements.personSubtotal.focus();
        calculate();
    }

    function parseExpression(str) {
        try {
            const cleanStr = str.replace(/[^-0-9+*/.]/g, '');
            if (!cleanStr) return 0;
            const result = new Function(`return ${cleanStr}`)();
            return isFinite(result) ? result : 0;
        } catch (e) {
            return 0;
        }
    }

    function calculate() {
        const bSub = parseFloat(elements.billSubtotal.value) || 0;
        const bTax = parseFloat(elements.billTax.value) || 0;
        const bTip = parseFloat(elements.billTip.value) || 0;
        const pSub = parseExpression(elements.personSubtotal.value);

        let taxRate = 0;
        let tipRate = 0;

        if (bSub > 0) {
            taxRate = (bTax / bSub) * 100;
            tipRate = (bTip / bSub) * 100;
        }

        display.taxRate.innerText = taxRate.toFixed(2);
        display.tipRate.innerText = tipRate.toFixed(2);

        const pTax = pSub * (taxRate / 100);
        const pTip = pSub * (tipRate / 100);
        const pTotal = pSub + pTax + pTip;

        display.total.innerText = '$' + format(pTotal);
        display.breakdown.innerText = `(Tax) $${format(pTax)} + (Tips) $${format(pTip)}`;
    }

    inputs.forEach(id => {
        elements[id].addEventListener('input', calculate);
    });
</script>

</body>
</html>
